<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Get Study Sprint Timer</title>
<meta name="robots" content="noindex" />
<link rel="canonical" href="https://studysprinttimer.com/get.html" />
<link rel="icon" type="image/png" href="./favicon.png" />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Manrope',sans-serif;background:#0a171a;color:#f2fafa;min-height:100vh;
    display:grid;place-items:center;text-align:center;padding:24px;}
  h1{font-family:'Space Grotesk';font-size:1.4rem;margin-bottom:8px}
  p{color:#9eb8ba;font-size:0.95rem}
  a{color:#40d9db;font-weight:700}
</style>
<script>
  // Otomatik yönlendirme, SEÇİM YOK (kullanıcı kararı, 6 Eyl 2026): Android'i
  // Play Store'a, geri kalan HER ŞEYİ (iPhone, iPad -- iPadOS Safari'nin
  // varsayılan kullanıcı ajanı "Macintosh" yazdığı için "masaüstü" gibi
  // görünür, ve gerçek masaüstü) App Store'a gönderir. İki düğmeli seçim
  // ekranı kaldırıldı; birebir uygulamanın birincil platformu App Store.
  (function () {
    var ua = navigator.userAgent || '';
    var target = /Android/i.test(ua)
      ? 'https://play.google.com/store/apps/details?id=com.harundogdu.studysprinttimer'
      : 'https://apps.apple.com/app/id6788031531';
    window.location.replace(target);
  })();
</script>
</head>
<body>
  <div>
    <h1>Study Sprint Timer</h1>
    <p>Redirecting&hellip; if nothing happens, <a href="https://apps.apple.com/app/id6788031531">open the App Store</a>.</p>
  </div>
</body>
</html>
