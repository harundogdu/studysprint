<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<link rel="icon" type="image/png" href="../favicon.png" />
<style>*,*::before,*::after{box-sizing:border-box}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Nok mu Ok mu?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one column, a single big card the host reads aloud to the table; next/previous below it. */
:root{
  --bg:#F5EFF3; --surface:#FFFFFF; --ink:#2A1E2E; --muted:#776879; --line:#E4D9E2;
  --accent:#6A3D9E; --accent-soft:#EFE6F8;
  --ok:#17826A; --ok-soft:#DDF3EC; --nok:#D2413A; --nok-soft:#FBE3E1;
  --shadow:0 18px 40px -18px rgba(70,30,80,.35);
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#18121C; --surface:#241B2A; --ink:#F2E9F0; --muted:#A897AA; --line:#3A2E41;
  --accent:#B48CE6; --accent-soft:#33264A;
  --ok:#3CC59F; --ok-soft:#173A32; --nok:#FF6F62; --nok-soft:#43201F;
  --shadow:0 18px 40px -18px rgba(0,0,0,.7); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#18121C; --surface:#241B2A; --ink:#F2E9F0; --muted:#A897AA; --line:#3A2E41;
  --accent:#B48CE6; --accent-soft:#33264A;
  --ok:#3CC59F; --ok-soft:#173A32; --nok:#FF6F62; --nok-soft:#43201F;
  --shadow:0 18px 40px -18px rgba(0,0,0,.7); color-scheme:dark }

html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
#app{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.1}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.logo{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em}
.n{color:var(--nok)} .o{color:var(--ok)}
.meta{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}

.hero h1{font-size:clamp(40px,11vw,56px);font-weight:800;letter-spacing:-.03em}
.hero p{color:var(--muted);margin-top:10px;max-width:40ch}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px}
.label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 13px;border-radius:999px;border:1.5px solid var(--line);font-weight:600;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.chip .g{font-family:var(--display);font-weight:800;color:var(--muted)}
.chip .c{color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.chip[aria-pressed="true"] .g{color:var(--accent)}
.err{font-size:14px;color:var(--nok);font-weight:600}

.btn{padding:16px 20px;border-radius:14px;font-weight:700;font-size:17px;text-align:center;background:var(--ink);color:var(--bg);width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.35;cursor:default}
.nav{display:grid;grid-template-columns:1fr 2fr;gap:10px}

/* Card */
.card{position:relative;background:var(--surface);border-radius:24px;box-shadow:var(--shadow);border:1px solid var(--line);
  min-height:min(58vh,440px);padding:52px 26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;animation:deal .3s ease-out;cursor:pointer}
.card .q{font-family:var(--display);font-weight:700;font-size:clamp(28px,7.6vw,38px);letter-spacing:-.02em;line-height:1.16}
.card .ask{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.01em}
.corner{position:absolute;display:flex;flex-direction:column;align-items:center;line-height:1;gap:3px;color:var(--accent)}
.corner b{font-family:var(--display);font-weight:800;font-size:22px}
.corner span{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-variant-numeric:tabular-nums}
.corner.tl{top:16px;left:18px} .corner.br{bottom:16px;right:18px;transform:rotate(180deg)}
.cat{position:absolute;top:18px;right:18px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
@keyframes deal{from{transform:translateY(12px) rotate(-1.5deg);opacity:.4}to{transform:none;opacity:1}}

/* Hand counter */
.tally{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cnt{border-radius:16px;padding:10px;display:flex;align-items:center;justify-content:space-between;gap:6px}
.cnt.ok{background:var(--ok-soft);color:var(--ok)} .cnt.nok{background:var(--nok-soft);color:var(--nok)}
.cnt .v{text-align:center;line-height:1}
.cnt .v b{display:block;font-family:var(--display);font-weight:800;font-size:30px;font-variant-numeric:tabular-nums}
.cnt .v span{font-size:12px;font-weight:700;letter-spacing:.06em}
.cnt button{width:40px;height:40px;border-radius:12px;background:var(--surface);color:inherit;font-weight:800;font-size:22px;line-height:1;flex:none}
.hint{font-size:13px;color:var(--muted);text-align:center}
.link{font-size:14px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;align-self:center;padding:6px}

@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>

<div id="app"></div>

<script>
// Her kart tek bir kişiyi (sevgilin) ve tek bir somut davranışı anlatır; masadakiler kendileri için "OK mu, NOK mu?" der.
const CATS = [
  {id:"ev", name:"Ev hali", g:"◆", cards:[
    "Sevgilin her akşam yemeği dışarıdan sipariş etmek istiyor.","Sevgilin maç olan akşamlar seninle hiç plan yapmıyor.",
    "Sevgilin yatmadan önce bir saat telefonda video izliyor.","Sevgilin bulaşıkları hep ertesi sabaha bırakıyor.",
    "Sevgilin evde sokak ayakkabısıyla dolaşıyor.","Sevgilin her hafta sonu öğlene kadar uyuyor.",
    "Sevgilin eve kedi almak istiyor.","Sevgilin yemek yerken sürekli telefonuna bakıyor.",
    "Sevgilin kirli çamaşırlarını sandalyenin üstüne atıyor.","Sevgilin kombiyi sonuna kadar açıp evde tişörtle geziyor.",
    "Sevgilin pazar günü bütün gün evden çıkmak istemiyor.","Sevgilin misafir gelecek diye bütün evi sana baştan temizletiyor.",
    "Sevgilin tuvalette 20 dakika telefonla oturuyor.","Sevgilin her gece horluyor ama doktora gitmiyor.",
    "Sevgilin birlikte izlediğiniz dizinin yeni bölümünü sensiz izliyor."]},
  {id:"aile", name:"Aile & akraba", g:"⌂", cards:[
    "Sevgilin her pazar kahvaltısını kendi ailesinde yapmak istiyor.","Sevgilinin annesi haber vermeden evinize geliyor.",
    "Sevgilin evinizin yedek anahtarını annesine veriyor.","Sevgilin annesiyle her gün telefonda yarım saat konuşuyor.",
    "Sevgilin aranızdaki kavgaları annesine anlatıyor.","Sevgilin ailesiyle aynı apartmanda oturmak istiyor.",
    "Sevgilinin kardeşi bir ay sizin evde kalıyor.","Sevgilin annesinin yemeklerini sürekli seninkilerle kıyaslıyor.",
    "Sevgilin her yaz tatilini ailesinin yazlığında geçirmek istiyor.","Sevgilin ailesiyle tartıştığında senden onun tarafını tutmanı bekliyor.",
    "Sevgilinin ailesi senin hakkında kötü konuşunca o sesini çıkarmıyor.","Sevgilin ikinizin fotoğraflarını aile WhatsApp grubunda paylaşıyor.",
    "Sevgilin bayramda senin ailenin ziyaretine gelmiyor.","Sevgilin önemli bir kararı sana sormadan babasına danışıyor.",
    "Sevgilin senin annenin doğum gününü unutuyor."]},
  {id:"sinir", name:"Kıskançlık", g:"♠", cards:[
    "Sevgilin eski sevgilisiyle arkadaş kalıyor.","Sevgilin eski sevgilisini Instagram'da takip ediyor.",
    "Sevgilin karşı cinsten bir iş arkadaşıyla baş başa öğle yemeğine çıkıyor.","Sevgilin senin telefonunu sana sormadan karıştırıyor.",
    "Sevgilin telefonunun şifresini sana söylemiyor.","Sevgilin tanımadığı birinin plaj fotoğrafını beğeniyor.",
    "Sevgilin gece 1'de gelen bir mesaja gülerek cevap veriyor.","Sevgilin senin konumunu sürekli görmek istiyor.",
    "Sevgilin senin yanında bir dizi oyuncusu için \"Çok çekici\" diyor.","Sevgilin arkadaşlarıyla gece 3'e kadar dışarıda kalıyor.",
    "Sevgilin mesajlarını sana göstermek istemiyor.","Sevgilin bir düğünde karşı cinsten biriyle baş başa dans ediyor.",
    "Sevgilin eski sevgilisinin hediye ettiği kolyeyi hâlâ takıyor.","Sevgilin sosyal medyada ikinizin fotoğrafını hiç paylaşmıyor.",
    "Sevgilin karşı cinsten en yakın arkadaşıyla her gün mesajlaşıyor."]},
  {id:"para", name:"Para", g:"₺", cards:[
    "Sevgilin iki maaşı ortak bir hesapta toplamak istiyor.","Sevgilin sana sormadan taksitle en pahalı telefonu alıyor.",
    "Sevgilin dışarıda her hesabı yarı yarıya bölmek istiyor.","Sevgilin ailesine her ay maaşından para gönderiyor.",
    "Sevgilin sana sormadan kuzenine borç para veriyor.","Sevgilin kredi kartı borcunu senden saklıyor.",
    "Sevgilin düğünde takılan altınları bozdurmak istiyor.","Sevgilin araba için biriktirdiğiniz parayla tatile gitmek istiyor.",
    "Sevgilin senden habersiz bir birikim hesabı tutuyor.","Sevgilin maaşının ne kadar olduğunu sana söylemiyor.",
    "Sevgilin işini bırakıp evde kalmak istiyor.","Sevgilin her ay kendine pahalı kıyafet alıyor.",
    "Sevgilin restoranda hesabı hep senin ödemeni bekliyor.","Sevgilin aldığın her şeyin fiyatını soruyor.",
    "Sevgilin ev almak için 20 yıllık kredi çekmek istiyor."]},
  {id:"romantik", name:"Romantik", g:"♥", cards:[
    "Sevgilin yıldönümünüzü unutuyor.","Sevgilin Sevgililer Günü'nü kutlamak istemiyor.",
    "Sevgilin doğum gününde sana hediye yerine para veriyor.","Sevgilin sokakta elini tutmak istemiyor.",
    "Sevgilin arkadaşlarının yanında sana \"aşkım\" diye sesleniyor.","Sevgilin kavgadan sonra seninle konuşmadan küs yatıyor.",
    "Sevgilin kavgadan sonra hiç özür dilemiyor.","Sevgilin doğum günü hediyesini kendisi seçip senden istiyor.",
    "Sevgilin sana hiç \"Seni seviyorum\" demiyor.","Sevgilin aylardır seninle baş başa yemeğe çıkmıyor.",
    "Sevgilin sana çiçek yerine mutfak robotu alıyor.","Sevgilin mesajlarına sadece \"tamam\" diye cevap veriyor.",
    "Sevgilin gün boyu seni bir kere bile aramıyor.","Sevgilin profil fotoğrafına ikinizin fotoğrafını koymuyor.",
    "Sevgilin herkesin içinde seni öpüyor."]},
  {id:"gelenek", name:"Gelenekler", g:"☾", cards:[
    "Sevgilin bayramın ilk günü önce kendi ailesine gitmek istiyor.","Sevgilin bayramda el öpmeye gitmek yerine tatile gitmek istiyor.",
    "Sevgilin düğün yapmadan sadece nikâh kıymak istiyor.","Sevgilin düğün masrafının tamamını ailelerin ödemesini istiyor.",
    "Sevgilin misafirliğe eli boş gidiyor.","Sevgilin habersiz gelen misafire kapıyı açmıyor.",
    "Sevgilin yılbaşını ailesiyle değil arkadaşlarıyla geçirmek istiyor.","Sevgilin çocuğunuza kendi annesinin istediği ismi koymak istiyor.",
    "Sevgilin Ramazan'da her akşam iftara ailesine gitmek istiyor.","Sevgilin kına gecesi yapmak istemiyor.",
    "Sevgilin düğünde takılan takıların mikrofonla anons edilmesini istiyor.","Sevgilin kız isteme töreni yapılmasını istemiyor.",
    "Sevgilin komşudan gelen tabağı boş geri veriyor.","Sevgilin büyüklerin elini öpmüyor.",
    "Sevgilin taziyeye gitmek yerine sadece mesaj atıyor."]}
];

const K="nokmuokmu.v2";
function load(){ try{ return JSON.parse(localStorage.getItem(K)||"{}") }catch(e){ return {} } }
function save(o){ try{ localStorage.setItem(K,JSON.stringify(o)) }catch(e){} }

let S;
function fresh(){
  const p=load(); const valid=(p.cats||[]).filter(id=>CATS.some(c=>c.id===id));
  return {screen:"setup", cats:valid.length?valid:CATS.map(c=>c.id), deck:[], i:0, ok:0, nok:0, err:""};
}
function start(data){ S=(data&&data.S)?data.S:fresh(); window.claude?.hot?.snapshot?.(()=>({S})); render(); }

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const catOf=id=>CATS.find(c=>c.id===id);
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a }

function render(){
  const right = S.screen==="play" ? `${S.i+1} / ${S.deck.length}` : "masa oyunu";
  document.getElementById("app").innerHTML =
    `<div class="brand"><div class="logo"><span class="n">Nok</span> mu <span class="o">Ok</span> mu?</div><div class="meta">${right}</div></div>` + VIEWS[S.screen]();
}

const VIEWS={
  setup(){
    const total=CATS.filter(c=>S.cats.includes(c.id)).reduce((n,c)=>n+c.cards.length,0);
    return `<div class="hero"><h1><span class="n">Nok</span> mu<br><span class="o">Ok</span> mu?</h1>
      <p>Kartı masaya yüksek sesle oku. Herkes kendi için cevap versin: sevgilin bunu yapsa sana OK mu, NOK mu?</p></div>
      <div class="panel"><div class="label">Kategoriler</div>
        <div class="chips">${CATS.map(c=>`<button class="chip" data-cat="${c.id}" aria-pressed="${S.cats.includes(c.id)}"><span class="g">${c.g}</span>${c.name}</button>`).join("")}</div>
        <p class="hint" style="text-align:left">${total} kart, karışık sırayla gelecek.</p></div>
      ${S.err?`<p class="err">${S.err}</p>`:""}
      <button class="btn" id="go">Başla</button>`;
  },
  play(){
    const c=S.deck[S.i], cat=catOf(c.cat), num=String(S.i+1).padStart(2,"0");
    const last=S.i+1>=S.deck.length;
    return `<div class="card" id="card" role="button" tabindex="0" aria-label="Sonraki kart">
        <div class="corner tl"><b>${cat.g}</b><span>${num}</span></div><div class="cat">${cat.name}</div>
        <p class="q">${esc(c.text)}</p>
        <p class="ask"><span class="o">OK</span> mu, <span class="n">NOK</span> mu?</p>
        <div class="corner br"><b>${cat.g}</b><span>${num}</span></div></div>
      <div class="tally">
        <div class="cnt ok"><button data-t="ok" data-d="-1" aria-label="OK sayısını azalt">−</button><div class="v"><b>${S.ok}</b><span>OK</span></div><button data-t="ok" data-d="1" aria-label="OK sayısını artır">+</button></div>
        <div class="cnt nok"><button data-t="nok" data-d="-1" aria-label="NOK sayısını azalt">−</button><div class="v"><b>${S.nok}</b><span>NOK</span></div><button data-t="nok" data-d="1" aria-label="NOK sayısını artır">+</button></div>
      </div>
      <p class="hint">İstersen el kaldıranları say. Sayaç her kartta sıfırlanır.</p>
      <div class="nav"><button class="btn ghost" id="prev" ${S.i===0?"disabled":""}>Önceki</button>
        <button class="btn" id="next">${last?"Baştan karıştır":"Sonraki kart"}</button></div>
      <button class="link" id="home">Kategorileri değiştir</button>`;
  }
};

function go(d){
  S.ok=0; S.nok=0;
  if(d>0 && S.i+1>=S.deck.length){ S.deck=shuffle(S.deck); S.i=0; }
  else S.i=Math.max(0,S.i+d);
  render();
}

document.addEventListener("click",e=>{
  if(e.target.closest("#card")) return go(1);
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.cat){
    const id=b.dataset.cat;
    S.cats=S.cats.includes(id)?S.cats.filter(x=>x!==id):[...S.cats,id];
    S.err=""; return render();
  }
  if(b.dataset.t){ S[b.dataset.t]=Math.max(0,S[b.dataset.t]+ +b.dataset.d); return render(); }
  if(b.id==="go"){
    if(!S.cats.length){ S.err="En az bir kategori seç."; return render(); }
    save({cats:S.cats});
    S.deck=shuffle(CATS.filter(c=>S.cats.includes(c.id)).flatMap(c=>c.cards.map(text=>({cat:c.id,text}))));
    S.i=0; S.ok=0; S.nok=0; S.screen="play"; return render();
  }
  if(b.id==="next") return go(1);
  if(b.id==="prev") return go(-1);
  if(b.id==="home"){ S.screen="setup"; return render(); }
});
document.addEventListener("keydown",e=>{
  if(S.screen!=="play") return;
  if(e.key==="ArrowRight"||(e.key==="Enter"&&e.target.id==="card")||(e.key===" "&&e.target.id==="card")){ e.preventDefault(); go(1); }
  if(e.key==="ArrowLeft") go(-1);
});

window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
</body>
</html>
